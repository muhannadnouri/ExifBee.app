name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Arch Linux pinned to one Arch Linux Archive snapshot: every system package, including
  # ExifTool from pacman, is a fixed version that meets the tested minimum (SPEC DEC-013).
  quality:
    runs-on: ubuntu-latest
    container: archlinux:base
    env:
      ARCH_SNAPSHOT: 2026/10/27
      RUST_TOOLCHAIN: 1.98.1
      EXIFTOOL: /usr/bin/vendor_perl/exiftool
    steps:
      - name: Install pinned system packages
        run: |
          echo "Server = https://archive.archlinux.org/repos/$ARCH_SNAPSHOT/\$repo/os/\$arch" > /etc/pacman.d/mirrorlist
          pacman -Syyuu --noconfirm --needed git base-devel curl file openssl webkit2gtk-4.1 \
            librsvg xdotool appmenu-gtk-module rustup perl-image-exiftool
          "$EXIFTOOL" -ver
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal \
            --component clippy,rustfmt,llvm-tools-preview
          rustup default "$RUST_TOOLCHAIN"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - run: npm ci
      - run: npm run test:traceability
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      # Runs every Vitest and cargo test (unit and real-ExifTool integration) under coverage.
      - run: npm run coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error

  # Advisory databases change daily, so this job reports new advisories without a code change.
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2
      - run: npm run audit:deps
